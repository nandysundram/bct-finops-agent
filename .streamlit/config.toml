[theme]
primaryColor = "#0066cc"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#212529"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8080
# Keep both CORS and XSRF protection enabled for safety. If you need cross-origin embedding,
# consider disabling XSRF explicitly and understand the security implications.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
