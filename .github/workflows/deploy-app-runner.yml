name: Deploy to AWS App Runner

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -e
          aws ecr describe-repositories --repository-names bct-finops-agent || aws ecr create-repository --repository-name bct-finops-agent

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build, tag and push Docker image
        run: |
          docker build -t bct-finops-agent:latest .
          docker tag bct-finops-agent:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/bct-finops-agent:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/bct-finops-agent:latest

      - name: Check for required App Runner credentials
        env:
          ACCESS_ROLE_ARN: ${{ secrets.APP_RUNNER_ACCESS_ROLE_ARN }}
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          set -e
          if [ -z "$SERVICE_ARN" ] && [ -z "$ACCESS_ROLE_ARN" ]; then
            echo "ERROR: Neither APP_RUNNER_SERVICE_ARN nor APP_RUNNER_ACCESS_ROLE_ARN is set."
            echo "If your image is in private ECR you must set APP_RUNNER_ACCESS_ROLE_ARN as a repository secret so App Runner can pull the image."
            echo "Alternatively, make the ECR image public or supply an existing APP_RUNNER_SERVICE_ARN that already has access."
            exit 1
          fi
          if [ -z "$ACCESS_ROLE_ARN" ]; then
            echo "APP_RUNNER_ACCESS_ROLE_ARN is not set; continuing only if you're updating an existing service or using a public image."
          else
            echo "APP_RUNNER_ACCESS_ROLE_ARN is set. Proceeding to create/update service with AuthenticationConfiguration."
          fi

      - name: Diagnostic: validate App Runner role & ECR image
        env:
          ACCESS_ROLE_ARN: ${{ secrets.APP_RUNNER_ACCESS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -e
          if [ -z "$ACCESS_ROLE_ARN" ]; then
            echo "Skipping role diagnostics because APP_RUNNER_ACCESS_ROLE_ARN is not set."
            exit 0
          fi

          echo "Running diagnostics for provided App Runner access role (redacting ARN)"
          # Extract role name from ARN
          ROLE_NAME=$(echo "$ACCESS_ROLE_ARN" | awk -F'/' '{print $NF}')
          echo "Role name: $ROLE_NAME"

          echo "1) Get role"
          aws iam get-role --role-name "$ROLE_NAME" || true

          echo "2) Assume role policy document"
          aws iam get-role --role-name "$ROLE_NAME" --query Role.AssumeRolePolicyDocument || true

          echo "3) List inline and attached policies"
          aws iam list-role-policies --role-name "$ROLE_NAME" || true
          aws iam list-attached-role-policies --role-name "$ROLE_NAME" || true

          echo "4) Attempt sts:assume-role (may fail if your workflow IAM does not have sts:AssumeRole on this role)"
          aws sts assume-role --role-arn "$ACCESS_ROLE_ARN" --role-session-name github-actions-debug --duration-seconds 900 || true

          echo "5) Verify ECR image exists"
          aws ecr describe-images --repository-name bct-finops-agent --image-ids imageTag=latest || aws ecr describe-repositories --repository-names bct-finops-agent || true

      - name: Update or create App Runner service
        env:
          ECR_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/bct-finops-agent:latest
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          ACCESS_ROLE_ARN: ${{ secrets.APP_RUNNER_ACCESS_ROLE_ARN }}
        run: |
          set -e
          if [ -z "$SERVICE_ARN" ]; then
            echo "No APP_RUNNER_SERVICE_ARN provided. Creating App Runner service..."
            if [ -z "$ACCESS_ROLE_ARN" ]; then
              aws apprunner create-service --service-name bct-finops-agent --source-configuration "ImageRepository={ImageIdentifier='$ECR_IMAGE',ImageRepositoryType='ECR',ImageConfiguration={Port='8080'}}"
            else
              echo "Using AccessRoleArn: (redacted)"
              aws apprunner create-service --service-name bct-finops-agent --source-configuration "ImageRepository={ImageIdentifier='$ECR_IMAGE',ImageRepositoryType='ECR',ImageConfiguration={Port='8080'}},AuthenticationConfiguration={AccessRoleArn='$ACCESS_ROLE_ARN'}"
            fi
          else
            echo "Updating App Runner service: $SERVICE_ARN"
            if [ -z "$ACCESS_ROLE_ARN" ]; then
              aws apprunner update-service --service-arn "$SERVICE_ARN" --source-configuration "ImageRepository={ImageIdentifier='$ECR_IMAGE',ImageRepositoryType='ECR',ImageConfiguration={Port='8080'}}"
            else
              echo "Using AccessRoleArn: (redacted)"
              aws apprunner update-service --service-arn "$SERVICE_ARN" --source-configuration "ImageRepository={ImageIdentifier='$ECR_IMAGE',ImageRepositoryType='ECR',ImageConfiguration={Port='8080'}},AuthenticationConfiguration={AccessRoleArn='$ACCESS_ROLE_ARN'}"
            fi
          fi

      - name: Wait & show service status (optional)
        run: |
          echo "Waiting 10s for App Runner to pick up the update..."
          sleep 10
          aws apprunner list-services --region ${{ secrets.AWS_REGION }}

      - name: Show App Runner logs URL (manual step)
        run: |
          echo "If you set up service manually, add APP_RUNNER_SERVICE_ARN to GitHub secrets to enable updates."

# Required GitHub Secrets:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - AWS_REGION
# - AWS_ACCOUNT_ID
# - (Optional) APP_RUNNER_SERVICE_ARN -> if set, workflow will update service instead of creating
